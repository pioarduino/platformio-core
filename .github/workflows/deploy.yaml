name: Build and Deploy Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_to_pypi:
        description: 'Upload to PyPI'
        required: true
        default: false
        type: boolean

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    
    - name: Install deps
      run: python -m pip install build twine
    
    - name: Build sdist
      run: python -m build . --sdist
    
    - uses: actions/upload-artifact@v7
      with:
        name: wheels-sdist
        path: dist/*.tar.gz
    
    - name: Check metadata
      run: twine check dist/*

  upload_pypi:
    needs: [build_sdist]
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || inputs.upload_to_pypi }}
    environment:
      name: pypi
      url: https://pypi.org/p/pioarduino
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: wheels-*
        merge-multiple: true
        path: dist
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.0
      with:
        skip-existing: true
